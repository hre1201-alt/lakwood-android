
name: Build Lakwood APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          api-level: 35
          build-tools: '35.0.0'

      - name: Extract project
        run: unzip -o lakwood_android_project_chrome.zip -d .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: lakwood_android_app
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lakwood-debug-apk
          path: lakwood_android_app/app/build/outputs/apk/debug/app-debug.apk
